/* Cassino Lab v0.2 — a fixed, single-viewport game surface. Menus scroll internally. */
html,body,#app { width:100%; height:100%; min-height:0; overflow:hidden; overscroll-behavior:none; }
.shell { box-sizing:border-box; width:100%; max-width:1180px; height:100vh; height:100dvh;
  min-height:0; margin:0 auto; padding: max(5px,env(safe-area-inset-top)) 8px max(5px,env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:4px; overflow:hidden; }
.header { margin:0; min-height:36px; flex:0 0 auto; }
.brand { gap:8px; }
.brand-icon { width:33px; height:33px; border-radius:9px; font-size:21px; }
.brand h1 { font-size:20px; }
.eyebrow { font-size:8px; letter-spacing:1.1px; }
.menu-button { padding:5px 10px; min-height:34px; min-width:44px; font-size:18px; }
.menu-button .top-label { display:inline; font-size:12px; }
.match-bar { flex:0 0 auto; border:1px solid #3a4b42; border-radius:10px; padding:5px 12px; gap:5px; }
.match-center b { font-size:14px; } .match-center span { font-size:9px; }
.score-player { gap:7px; } .score-player b { font-size:21px; } .score-player small { font-size:8px; }
.felt { flex:1 1 auto; min-height:0; height:0; border:1px solid #3a564c; border-radius:12px;
  padding:7px 9px 4px; overflow:hidden; display:flex; flex-direction:column; }
.opponent-area { flex:0 0 auto; align-items:center; min-height:38px; }
.player-caption { gap:7px; }
.player-caption b { font-size:11px; } .player-caption small { font-size:9px; }
.avatar { width:25px; height:25px; font-size:8px; }
.opponent-hand { min-height:34px; }
.card-back { width:27px; height:37px; margin-left:-9px; border-width:2px; }
.back-pattern { font-size:12px; }
.table-area { flex:1 1 auto; min-height:0; height:0; width:100%; padding:3px 0 5px;
  justify-content:center; overflow:hidden; }
.table-title { margin:0 0 3px; flex:0 0 auto; font-size:9px; }
.table-cards { flex:1 1 auto; min-height:0; height:100%; width:100%; max-width:100%;
  padding:2px 0 5px; gap:5px; flex-wrap:wrap; justify-content:center; align-content:center;
  overflow:auto; overscroll-behavior:contain; scrollbar-width:thin; }
.playing-card { width:clamp(40px,12.6vw,64px); height:clamp(57px,18vw,91px); border-radius:6px; }
.card-corner { top:4px; left:5px; } .card-corner b { font-size:clamp(13px,3.9vw,19px); }
.card-corner small { font-size:clamp(11px,3.6vw,16px); } .card-corner.bottom { right:5px; bottom:4px; }
.card-big { font-size:clamp(22px,7vw,34px); }
.playing-card.mini { width:clamp(25px,7vw,34px); height:clamp(36px,10vw,49px); }
.mini .card-corner b { font-size:11px; } .mini .card-corner small { font-size:8px; } .mini .card-big { font-size:16px; }
.build-item { min-height:0; gap:3px; padding:4px 6px; max-width:min(100%,290px); border-radius:8px; }
.build-groups { flex-wrap:nowrap; overflow-x:auto; max-width:100%; }
.build-group { flex:0 0 auto; } .build-group>.playing-card:not(:first-child) { margin-left:-17px; }
.build-top { gap:4px; }.build-top b { font-size:9px; } .build-top small,.build-top em { font-size:7px; }
.human-area { flex:0 0 auto; padding:0 0 2px; }
.human-area .player-caption { margin:0 0 4px; }
.human-hand { min-height:0; height:auto; gap:clamp(5px,2.4vw,11px); align-items:center; }
.hand-item.selected { transform:translateY(-5px); }
.table-item.selected,.build-item.selected { transform:translateY(-3px); }
.table-footer { flex:0 0 auto; margin-top:2px; padding-top:5px; min-height:21px; align-items:center; }
.turn-indicator { font-size:10px; } .last-move { max-width:65%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:9px; }
.controls { flex:0 0 auto; position:relative; z-index:4; margin:0; padding:5px 8px 6px; border-radius:10px; }
.selection-row { margin:0 0 4px; min-height:24px; gap:5px; font-size:10px; }
.selection-status { flex:1 1 auto; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.quick-tools { display:flex; flex:0 0 auto; gap:5px; }
.mini-tool { width:31px; height:26px; padding:0; border:1px solid #435b4c; background:#26392e;
  border-radius:7px; color:#e6c986; font-size:19px; line-height:1; display:grid; place-items:center; }
.mini-tool:disabled { opacity:.32; }
.main-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.main-actions .action-btn { min-height:40px; padding:6px 3px; font-size:13px; gap:7px; }
.main-actions .action-btn span { font-size:17px; }
.main-actions .build-main { border-color:#c19a5c; background:#43452e; color:#ffe3ac; }
.main-actions .action-btn.primary { background:linear-gradient(155deg,#f3d18f,#e4b867); }
.feedback { margin:4px 0 0; min-height:12px; max-width:100%; font-size:10px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    if (action === 'setup-new-game') { setup = {difficulty:game.rules.difficulty||'thoughtful',preset:'classic'}; modal='newgame'; sound('tap'); render(); return; }
    if (action === 'setup-difficulty') { setup.difficulty=node.dataset.value; render(); return; }
    if (action === 'setup-preset') { setup.preset=node.dataset.value; render(); return; }
    if (action === 'start-game') {
      const rules = setup.preset==='custom' ? { ...game.rules,difficulty:setup.difficulty } : E.rulesFor(setup.preset,{difficulty:setup.difficulty});
      startNewMatch(rules,false);return;
    }
    if (action === 'menu') { modal = 'menu'; sound('tap'); render(); return; }
    if (action === 'settings') return openSettings();
    if (action === 'rules' || action === 'history') { modal = action; render(); return; }
    if (action === 'toggle-sound') { prefs.sound = !prefs.sound; savePrefs(); if (prefs.sound) sound('tap'); render(); return; }
    if (action === 'toggle-animations') { prefs.animations = !prefs.animations; savePrefs(); render(); return; }
    if (action === 'build-menu') {
      if (!isHumanTurn() || !buildOptions.length) return;
      if (buildOptions.length === 1) return play(buildOptions[0]);
      buildMenuOpen = !buildMenuOpen; sound('tap'); render(); return;
    }
    if (action === 'hide-builds') { buildMenuOpen = false; render(); return; }
    if (action === 'close') { modal = ''; render(); return; }
    if (action === 'new-match') return startNewMatch(game.rules, true);
    if (action === 'next-hand') return nextHand();
    if (action === 'undo') return undo();
    if (action === 'apply-settings') {
      const nextRules = { ...draft };
      if (draftPreset !== 'custom') nextRules.name = E.PRESETS[draftPreset].name;
      if (!nextRules.builds) { nextRules.multipleBuilds = false; nextRules.allowTrailWithOwnBuild = false; }
      if (game.phase === 'playing' && !confirm('Start a new match with these rules?')) return;
      return startNewMatch(nextRules, false);
    }
    if (action === 'hand') {
      if (!isHumanTurn()) return;
      const id = node.dataset.id;
      if (pickedCard === id) { resetSelection(); toast = ''; } else { pickedCard = id; pickedTable.clear(); hint = null; buildMenuOpen = false; toast = ''; }
      sound('tap'); return render();
    }
    if (action === 'table') {
      if (!isHumanTurn() || !pickedCard) { toast = 'Choose a card from your hand first.'; render(); return; }
      const id = node.dataset.id;
      if (pickedTable.has(id)) pickedTable.delete(id); else pickedTable.add(id);
      toast = ''; hint = null; buildMenuOpen = false; sound('tap'); return render();
    }
    if (action === 'clear') { resetSelection(); toast = ''; return render(); }
    if (action === 'trail' || action === 'capture') return play({ kind: action, cardId: pickedCard, targetIds: action === 'trail' ? [] : currentSelection() });
    if (action === 'build') return play(buildOptions[Number(node.dataset.index)]);
    if (action === 'hint') {
      if (!isHumanTurn()) return;
      const move = E.chooseComputerMove(game);
      pickedCard = move.cardId; pickedTable = new Set(move.targetIds || []);
      hint = move;
      toast = `Suggestion: ${E.explainMove(game, move)}`;
      return render();
    }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && modal) { modal = ''; render(); }
    else if (ev.key.toLowerCase() === 'u' && !modal && checkpoint) undo();
  });
  render(); // The main menu is the entry point; the computer does not move until Resume/Start.
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    // A new deployment becomes available on the same URL. Let the player
    // choose when to reload so an ongoing turn is not interrupted.
    const hadController = !!navigator.serviceWorker.controller;
    if (hadController) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (document.getElementById('update-notice')) return;
        const bar = document.createElement('div');
        bar.id = 'update-notice';
        bar.className = 'update-notice';
        bar.innerHTML = '<span>A new Cassino Lab version is ready.</span><button type="button">Update now</button>';
        bar.querySelector('button').addEventListener('click', () => {
          persist();
          location.reload();
        });
        document.body.appendChild(bar);
      });
    }
    navigator.serviceWorker.register('./service-worker.js')
      .then(registration => {
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') registration.update().catch(() => {});
        });
      }).catch(() => {});
  }
})();
</script>
</body></html>
