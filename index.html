/* Cassino Lab v0.2 — a fixed, single-viewport game surface. Menus scroll internally. */
html,body,#app { width:100%; height:100%; min-height:0; overflow:hidden; overscroll-behavior:none; }
.shell { box-sizing:border-box; width:100%; max-width:1180px; height:100vh; height:100dvh;
  min-height:0; margin:0 auto; padding: max(5px,env(safe-area-inset-top)) 8px max(5px,env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:4px; overflow:hidden; }
.header { margin:0; min-height:36px; flex:0 0 auto; }
.brand { gap:8px; }
.brand-icon { width:33px; height:33px; border-radius:9px; font-size:21px; }
.brand h1 { font-size:20px; }
.eyebrow { font-size:8px; letter-spacing:1.1px; }
.menu-button { padding:5px 10px; min-height:34px; min-width:44px; font-size:18px; }
.menu-button .top-label { display:inline; font-size:12px; }
.match-bar { flex:0 0 auto; border:1px solid #3a4b42; border-radius:10px; padding:5px 12px; gap:5px; }
.match-center b { font-size:14px; } .match-center span { font-size:9px; }
.score-player { gap:7px; } .score-player b { font-size:21px; } .score-player small { font-size:8px; }
.felt { flex:1 1 auto; min-height:0; height:0; border:1px solid #3a564c; border-radius:12px;
  padding:7px 9px 4px; overflow:hidden; display:flex; flex-direction:column; }
.opponent-area { flex:0 0 auto; align-items:center; min-height:38px; }
.player-caption { gap:7px; }
.player-caption b { font-size:11px; } .player-caption small { font-size:9px; }
.avatar { width:25px; height:25px; font-size:8px; }
.opponent-hand { min-height:34px; }
.card-back { width:27px; height:37px; margin-left:-9px; border-width:2px; }
.back-pattern { font-size:12px; }
.table-area { flex:1 1 auto; min-height:0; height:0; width:100%; padding:3px 0 5px;
  justify-content:center; overflow:hidden; }
.table-title { margin:0 0 3px; flex:0 0 auto; font-size:9px; }
.table-cards { flex:1 1 auto; min-height:0; height:100%; width:100%; max-width:100%;
  padding:2px 0 5px; gap:5px; flex-wrap:wrap; justify-content:center; align-content:center;
  overflow:auto; overscroll-behavior:contain; scrollbar-width:thin; }
.playing-card { width:clamp(40px,12.6vw,64px); height:clamp(57px,18vw,91px); border-radius:6px; }
.card-corner { top:4px; left:5px; } .card-corner b { font-size:clamp(13px,3.9vw,19px); }
.card-corner small { font-size:clamp(11px,3.6vw,16px); } .card-corner.bottom { right:5px; bottom:4px; }
.card-big { font-size:clamp(22px,7vw,34px); }
.playing-card.mini { width:clamp(25px,7vw,34px); height:clamp(36px,10vw,49px); }
.mini .card-corner b { font-size:11px; } .mini .card-corner small { font-size:8px; } .mini .card-big { font-size:16px; }
.build-item { min-height:0; gap:3px; padding:4px 6px; max-width:min(100%,290px); border-radius:8px; }
.build-groups { flex-wrap:nowrap; overflow-x:auto; max-width:100%; }
.build-group { flex:0 0 auto; } .build-group>.playing-card:not(:first-child) { margin-left:-17px; }
.build-top { gap:4px; }.build-top b { font-size:9px; } .build-top small,.build-top em { font-size:7px; }
.human-area { flex:0 0 auto; padding:0 0 2px; }
.human-area .player-caption { margin:0 0 4px; }
.human-hand { min-height:0; height:auto; gap:clamp(5px,2.4vw,11px); align-items:center; }
.hand-item.selected { transform:translateY(-5px); }
.table-item.selected,.build-item.selected { transform:translateY(-3px); }
.table-footer { flex:0 0 auto; margin-top:2px; padding-top:5px; min-height:21px; align-items:center; }
.turn-indicator { font-size:10px; } .last-move { max-width:65%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:9px; }
.controls { flex:0 0 auto; position:relative; z-index:4; margin:0; padding:5px 8px 6px; border-radius:10px; }
.selection-row { margin:0 0 4px; min-height:24px; gap:5px; font-size:10px; }
.selection-status { flex:1 1 auto; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.quick-tools { display:flex; flex:0 0 auto; gap:5px; }
.mini-tool { width:31px; height:26px; padding:0; border:1px solid #435b4c; background:#26392e;
  border-radius:7px; color:#e6c986; font-size:19px; line-height:1; display:grid; place-items:center; }
.mini-tool:disabled { opacity:.32; }
.main-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.main-actions .action-btn { min-height:40px; padding:6px 3px; font-size:13px; gap:7px; }
.main-actions .action-btn span { font-size:17px; }
.main-actions .build-main { border-color:#c19a5c; background:#43452e; color:#ffe3ac; }
.main-actions .action-btn.primary { background:linear-gradient(155deg,#f3d18f,#e4b867); }
.feedback { margin:4px 0 0; min-height:12px; max-width:100%; font-size:10px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.footer { display:none; }
.build-choice-panel { position:absolute; z-index:20; left:5px; right:5px; bottom:calc(100% + 5px);
  background:#243b31; border:1px solid #c7a167; box-shadow:0 12px 30px #000b; border-radius:11px;
  max-height:45dvh; overflow-y:auto; padding:9px; }
.choice-head { display:flex; justify-content:space-between; align-items:center; color:#f8e0a4; font-size:12px; }

  height:calc(var(--stack-card-width)/.715 + (var(--layers) - 1)*var(--stack-step));

/* v0.5.4 — build piles modeled after visible stacked-card transitions.

.build-pile { --stack-splay:0px!important; width:var(--stack-card-width)!important; }

   The original blue SVG is retained; its tile and margins scale with the card,

/* Paint every full-size card's border using the same rounded border box.
   The face covers the padding box. The dark color occupies only the actual
   1px border; a 2px taper ends at the start of the 2px corner radius.
   Identical paint geometry avoids fractional-pixel thickness discrepancies. */
@property --divider-paper {syntax:"<color>";inherits:false;initial-value:#fff;}
@property --divider-edge {syntax:"<color>";inherits:false;initial-value:#c8c8c8;}
.playing-card:not(.mini) {
  border-color:transparent;
  background-image:linear-gradient(var(--divider-paper,#fff),var(--divider-paper,#fff)),
    linear-gradient(to right,var(--divider-edge,#c8c8c8) 2px,
      var(--divider-dark,var(--divider-edge,#c8c8c8)) 4px,
      var(--divider-dark,var(--divider-edge,#c8c8c8)) calc(100% - 4px),
      var(--divider-edge,#c8c8c8) calc(100% - 2px)),
    linear-gradient(var(--divider-edge,#c8c8c8),var(--divider-edge,#c8c8c8));
  background-origin:padding-box,border-box,border-box;
  background-clip:padding-box,border-box,border-box;
  background-position:center,top center,center;
  background-size:100% 100%,100% 3px,100% 100%;
  background-repeat:no-repeat;
}
.build-layer.build-group-start > .playing-card,
.card-flight.build-group-start > .playing-card {--divider-dark:#605a51;}

/* Animation-only overlay: the selected face fades as a single texture. */
.card-flight > .playing-card.flight-selection-tint {
  position:absolute;inset:0;z-index:4;pointer-events:none;
  will-change:opacity;box-shadow:none;
}

/* Dialogs stay above every moving card, including the top capture card. */
.overlay {z-index:1100;}

/* Both sides of the opponent's moving card are painted before the flip.
   Each has its own transform, independent of the outer flight geometry. */
.card-flight.two-sided-flight > .playing-card,
.card-flight.two-sided-flight > .card-back {
  position:absolute;inset:0;backface-visibility:hidden;
  transform-origin:center;will-change:transform;
}
.card-flight.two-sided-flight > .playing-card {transform:rotateY(-180deg);}
.card-flight.two-sided-flight > .card-back {transform:rotateY(0deg);}

/* A tap must not leave a card raised through touch-emulated :hover.
   Only the selection class moves a card. The separate WAAPI translate
   remains available for actual changes to table or hand positions. */
.shell .hand-item:not(.selected),
.shell .table-item:not(.selected),
.shell .build-item:not(.selected) {transform:translateY(0);}
 .shell .hand-item.selected,.shell .table-item.selected {transform:translateY(-5px);}
 .shell .build-item.selected {transform:translateY(-6px);}
.animations-on .hand-item,.animations-on .table-item,.animations-on .build-item {
  transition:transform 190ms cubic-bezier(.2,.8,.2,1);
}
/* The historical loose-card selector is more specific than the shared
   rule above; explicitly replace its transition for table selections. */
.shell.animations-on .table-stage .table-cards .table-item{
  transition:transform 190ms cubic-bezier(.2,.8,.2,1);
}
.shell.animations-on .table-stage .table-builds .build-item{
  transition:transform 190ms cubic-bezier(.2,.8,.2,1);
}
.animations-off .hand-item,.animations-off .table-item,.animations-off .build-item {
  transition:none!important;
}
@media(prefers-reduced-motion:reduce){
  .animations-on .hand-item,.animations-on .table-item,.animations-on .build-item {transition:none!important;}
}
/* Four choices stay in one row, even on narrow phones. */
.unified-setup .diff-row .pill-choice {

  font-size:clamp(11px,3.6vw,16px);
}

}

.hand-slider-setting .hand-size-number{width:52px;min-width:0;min-height:34px;padding:5px 2px;box-sizing:border-box;font:750 14px/1.2 system-ui,sans-serif;font-variant-numeric:tabular-nums;text-align:center;border:1px solid #d6c9a8;background:#f3ecda;border-radius:7px;color:#214d36;appearance:textfield;-moz-appearance:textfield}

.hand-slider-setting .hand-size-number:focus{border-color:#195b40;outline:2px solid #195b4030;outline-offset:1px}
.hand-slider-setting .hand-size-number:disabled{opacity:.45}

/* v0.8.4: unified build construction and editable custom range bounds. */
.build-range-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:9px 0 12px;border-top:1px solid #e4d9c1}
.build-range-editor>small{grid-column:1/-1;font-size:10px;color:#71664f;line-height:1.35}
.build-range-editor.is-inactive{opacity:.48}
.build-bound{min-width:0;display:flex;flex-direction:column;gap:5px}
.build-bound>label{font-size:11px;font-weight:650;color:#625941}
.build-bound-combo{display:flex;min-width:0;border:1px solid #cbbd9a;border-radius:7px;background:#f3ecda;overflow:hidden}
.build-bound-combo input,.build-bound-combo select{font:650 13px/1.2 system-ui,sans-serif;color:#263b2b;background:transparent;border:0;min-height:40px;min-width:0}
.build-bound-combo input{flex:1;width:0;padding:5px;text-align:center;appearance:textfield;-moz-appearance:textfield}

.build-bound-combo input:focus,.build-bound-combo select:focus{outline:none}

/* v0.8.6: player setup and responsive seating diagram */
.player-count-setting{grid-template-columns:minmax(0,1fr) 28px 44px}
.player-count-setting .player-count-number{min-height:32px;display:grid;place-items:center;font-weight:750;color:#214d36;font-size:15px;border:1px solid #d6c9a8;border-radius:7px;background:#f3ecda}
.player-count-control{padding-bottom:5px;gap:0}
.player-count-ticks{display:flex;justify-content:space-between;align-items:flex-start;padding:1px 7px 0;pointer-events:none}
.player-count-ticks span{width:12px;display:flex;align-items:center;flex-direction:column;gap:4px;color:#71664f}
.player-count-ticks i{width:5px;height:5px;border-radius:50%;background:#b8ab8b;flex:none}
.player-count-ticks b{font-size:11px;font-weight:550;line-height:1}
.player-count-ticks span.active{color:#195b40}
.player-count-ticks span.active i{width:7px;height:7px;background:#195b40}
.player-count-ticks span.active b{font-weight:800}
.player-count-setting.is-inactive .player-count-number{opacity:.45}
.player-setup-group .setup-table-figure{padding:8px 5px 11px}
.setup-table-svg{display:block;width:100%;max-width:360px;height:auto;margin:0 auto;overflow:visible;font-family:system-ui,sans-serif}
.setup-preview-note{text-align:center;font-size:11px;line-height:1.4;color:#8a5e2f;margin:8px 0 0}

/* v0.8.7: polar rectangles only, with a completely empty center. */
.setup-table-figure .setup-table-svg{max-width:340px}

/* v0.9.0: fixed seating preview dimensions for every arrangement. */
.setup-table-figure .setup-table-svg{aspect-ratio:320/220}
.inactive-rule-note{color:#776b53}

/* Multiplayer keeps the human hand and shared playfield; each CPU has its
   own compact hand, color, active-turn indicator and flight destination. */
.multiplayer-game .opponent-area{width:100%;box-sizing:border-box;padding:4px 6px;min-height:0}
.multi-cpu-seats{display:flex;justify-content:center;align-items:stretch;gap:4px;width:100%;max-width:760px;margin:0 auto}
.multi-cpu-seat{flex:1 1 0;min-width:0;padding:5px 2px 3px;border:1px solid #ffffff35;border-top:3px solid var(--seat-color);border-radius:7px;background:#102e268c;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:3px;color:#fff;box-sizing:border-box}
.multi-cpu-seat.current-seat{background:#ffffff20;border-color:#efd187;box-shadow:0 0 0 1px #efd187}
.multi-seat-caption{display:flex;flex-direction:column;text-align:center;line-height:1.1;gap:2px;white-space:nowrap;min-height:25px;width:100%;font-size:10px}

.multiplayer-game .multi-seat-hand{display:flex;justify-content:center;align-items:center;width:100%;min-width:0;max-width:100%;gap:0;min-height:28px;height:32px;overflow:hidden;margin:0;padding:0}
.multiplayer-game .multi-seat-hand .card-back{flex:0 1 18px;min-width:8px;width:18px;height:26px;margin-left:-5px;box-sizing:border-box}
.multiplayer-game .multi-seat-hand .card-back:first-child{margin-left:0}
.multi-results-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;margin:10px 0}
.multi-results-scores>div{background:#f5f0df;border:1px solid #d2c49f;border-top:4px solid var(--side-color);border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 3px;min-width:0;text-align:center}
.multi-results-scores b{font-size:23px;color:#142719}.multi-results-scores small,.multi-results-scores span{font-size:10px;line-height:1.3;color:#4e492b}
.multi-score-scroll{max-width:100%;overflow-x:auto}
.dialog .multi-result-table{min-width:max-content;font-size:12px}
.dialog .multi-result-table th,.dialog .multi-result-table td{padding:7px 6px;white-space:nowrap}
@media(max-width:360px){.multi-cpu-seats{gap:2px}.multi-seat-caption b{font-size:10px}.multi-seat-caption{font-size:9px}}
@media(max-height:480px) and (orientation:landscape){.multi-cpu-seat{flex-direction:row;gap:4px;padding:2px 3px}.multi-seat-caption{width:auto}.multiplayer-game .multi-seat-hand{height:26px;min-height:26px}}

/* v0.10.2 — named saved variants, device-level row fitting. */
.saved-variant-controls{margin:8px 0 5px}
.saved-variant-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.saved-variant-actions .rules-reset{min-height:34px;padding:7px 9px;font-size:11px}
.saved-variant-actions .variant-delete{color:#963c34;border-color:#cda49c}
.saved-variant-source{font-size:11px;line-height:1.4;color:#685c43;margin:5px 1px}
.variant-editor{display:flex;flex-direction:column;gap:7px;padding:10px;margin-top:7px;border:1px solid #d8ccb0;border-radius:9px;background:#fffaf1}
.variant-editor>label{font-size:12px;font-weight:700;color:#254e37}
.variant-editor input{box-sizing:border-box;min-width:0;width:100%;min-height:42px;font:500 16px/1.2 system-ui,sans-serif;background:#fffef8;border:1px solid #cbbd9a;border-radius:7px;color:#263b2b;padding:8px}
.variant-editor .saved-variant-actions{justify-content:flex-end}
.variant-editor .variant-save-primary{background:#195b40;border-color:#195b40;color:#fffaf1;min-width:70px}
.variant-message{font-size:11px;line-height:1.4;color:#245a3c;margin:5px 1px}
.variant-message.variant-error{color:#98372c}
/* Gameplay HUD: fixed action slot, stable hand and responsive table lanes. */
.shell .felt{justify-content:flex-start;gap:0;--score-gap:clamp(4px,1.1dvh,9px)}
.shell .opponent-area{position:relative;top:auto;left:auto;right:auto;order:0;flex:0 0 auto}
.shell .table-area{position:relative;order:1;flex:1 1 0;min-height:0;height:0;container-type:size;padding:0}
.shell .table-stage{top:50%!important;min-height:0;height:100%;max-height:100%;margin:0!important;transform:translateY(-50%)}
.shell .turn-action-area{order:2;flex:0 0 auto;display:flex;align-items:center;justify-content:center;height:clamp(38px,6.5dvh,53px);min-width:0;position:relative;z-index:16}
.shell .move-action-slot{display:flex;align-items:center;justify-content:center;min-height:0;height:100%;min-width:0;width:100%}
.shell .move-action-slot .contextual-controls{position:relative;inset:auto;translate:none;transform:none;order:unset;flex:0 1 auto;width:100%;max-width:100%;max-height:100%;min-height:0;margin:0;padding:0;display:flex;align-items:center;justify-content:center}
.shell .move-action-slot .contextual-controls .main-actions{display:flex;flex-wrap:nowrap;justify-content:safe center;align-items:center;max-height:100%;min-height:0;width:100%;gap:7px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;scrollbar-width:none;padding:2px 1px}
.shell .move-action-slot .main-actions .action-btn{flex:0 1 118px;min-width:max-content;max-width:none;white-space:nowrap;padding-inline:12px}
.shell .move-action-slot .main-actions:has(> :nth-child(3)){gap:4px}
.shell .move-action-slot .main-actions:has(> :nth-child(3)) .action-btn{padding-inline:5px}
.shell .move-action-slot .main-actions:has(> :nth-child(5)){gap:2px}
.shell .move-action-slot .main-actions:has(> :nth-child(5)) .action-btn{padding-inline:2px}
.shell .human-area{order:3;position:relative;inset:auto;flex:0 0 auto;gap:var(--score-gap);margin:0;padding:0 0 var(--score-gap)}
.shell .your-score-tag{margin:0;align-self:center;border:1px solid #ffffff35;border-top:3px solid var(--seat-color,#346da8);background:#102e268c;color:#fff;border-radius:10px;flex:none}
.shell .game-stats{order:4;margin:0 0 4px;flex:0 0 auto}
.shell .game-toolbar .toolbar-left,.shell .game-toolbar .header-actions{flex:0 0 auto;gap:clamp(2px,.7vw,6px)}
.shell .game-toolbar .game-back,.shell .game-toolbar .game-help{width:clamp(26px,8.2vw,42px)}
.shell .game-toolbar .opponent-tag{flex:0 1 auto;min-width:0;max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell .multi-cpu-seat{justify-content:center;gap:5px;padding:4px 2px}
.shell .multi-seat-caption{min-height:0;flex:none}
/* Four permanent loose-card columns; the right lane never collapses. */
.shell .table-stage .table-cards,
.shell .table-stage:has(.table-builds:not(:empty)) .table-cards,
.shell .table-stage:not(:has(.table-builds:not(:empty))) .table-cards{
  --row-cols:4;--row-rows:var(--portrait-rows,1);--row-gap:var(--multi-gap,4px);
  --row-card-width:min(var(--row-max-width),max(2px,calc((100% - 3*var(--row-gap))/4)),max(2px,calc((var(--row-budget) - (var(--row-rows) - 1)*var(--row-gap))*.715/var(--row-rows))));
  --row-max-width:64px;--row-budget:max(12px,calc(88cqh - 16px));
  width:calc(100% - var(--build-lane))!important;max-width:calc(100% - var(--build-lane))!important;
  top:56%!important;height:auto;max-height:none;padding:4px 2px;
  display:grid;grid-template-columns:repeat(4,var(--row-card-width));grid-auto-rows:max-content;
  box-sizing:border-box;min-width:0;align-items:center;align-content:center!important;justify-content:start!important;
  gap:var(--row-gap);overflow:visible;touch-action:auto;scrollbar-width:none;
}
.shell .table-stage .table-cards .table-item{width:100%;min-width:0;max-width:none;padding:0;margin:0}
.shell .table-stage .table-cards .table-item .playing-card:not(.mini){display:block;width:100%!important;max-width:100%;min-width:0;height:auto!important;aspect-ratio:.715;margin:0}
.shell .table-stage .table-builds:not(:empty){top:56%!important;max-height:84%}
/* The hand reserves exactly two card heights, one fixed gap and lift clearance.
   Cards keep their physical dimensions; only their positions/overlap change. */
.shell .human-hand{
  --hand-gap:4px;--hand-budget:min(29dvh,220px);--hand-cap:clamp(46px,15.1vw,67px);
  --hand-card-width:min(var(--hand-cap),max(14px,calc((var(--hand-budget) - var(--hand-gap) - 12px)*.715/2)));
  position:relative;display:block;flex:none;box-sizing:border-box;width:100%;max-width:100%;
  height:calc(2 * var(--hand-card-width) / .715 + var(--hand-gap) + 12px);
  min-height:0;max-height:none;padding:0 4px;gap:var(--hand-gap);overflow:visible;isolation:isolate;
}
.shell .human-hand .hand-item{position:absolute;left:4px;top:4px;width:var(--hand-card-width);height:auto;min-width:0;max-width:none;padding:0;margin:0;border:0}
.shell .human-hand .playing-card:not(.mini){display:block;width:100%!important;max-width:100%;min-width:0;height:auto!important;aspect-ratio:.715;margin:0}
.shell .human-hand.hand-inactive{filter:grayscale(.7) brightness(.86)}
.shell .human-hand .playing-card:not(.mini) .card-corner:not(.bottom),.hand-deal-flight .playing-card:not(.mini) .card-corner:not(.bottom){
  grid-template-columns:calc(25cqw * var(--hand-index-scale,1)) calc(19cqw * var(--hand-index-scale,1));
  column-gap:calc(1cqw * var(--hand-index-scale,1))
}
.shell .human-hand .playing-card:not(.mini) .card-corner:not(.bottom) b,.hand-deal-flight .playing-card:not(.mini) .card-corner:not(.bottom) b{font-size:calc(24cqw * var(--hand-index-scale,1))}
.shell .human-hand .playing-card:not(.mini) .card-corner:not(.bottom) small,.hand-deal-flight .playing-card:not(.mini) .card-corner:not(.bottom) small{font-size:calc(19cqw * var(--hand-index-scale,1))}
.shell .human-hand .playing-card.rank-joker .card-corner:not(.bottom) b,.hand-deal-flight .playing-card.rank-joker .card-corner:not(.bottom) b{font-size:calc(10cqw * var(--hand-index-scale,1))}
@media(orientation:landscape) and (max-height:500px){
 .shell .human-hand{--hand-cap:clamp(35px,6.1vw,53px);--hand-budget:min(29dvh,120px)}
 .shell .turn-action-area{height:clamp(29px,8dvh,41px)}
 .shell .move-action-slot .main-actions .action-btn{padding-inline:8px}
 .shell .move-action-slot .main-actions:has(> :nth-child(3)) .action-btn{padding-inline:4px}
 .shell .multi-cpu-seat{gap:3px;padding:2px 3px}
}

/* v0.10.4 — tap-to-cycle team arrangement; seat colors are the legend. */
.rules-setting .team-cycle-control{width:clamp(96px,32vw,150px);min-width:0;min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid #cbbd9a;border-radius:7px;background:#f3ecda;color:#25281e;padding:6px 9px;font:inherit;font-size:12px;text-align:left;cursor:pointer;touch-action:manipulation}
.rules-setting .team-cycle-control svg{flex:none;color:#526c54}
.rules-setting .team-cycle-control:disabled{opacity:1;cursor:default;justify-content:flex-start;background:#f3ecda;color:#5e5642}
.rules-setting .team-cycle-control:focus-visible{outline:2px solid #195b40;outline-offset:2px}
@media(max-width:350px){.rules-setting .team-cycle-control{width:108px;font-size:11px}}

/* v0.10.6 — compact direct sort switch in the existing toolbar. */
.shell .game-toolbar .hand-sort-toggle{display:grid;place-items:center;flex:0 0 auto;width:clamp(39px,11.5vw,48px);height:100%;min-height:0;min-width:0;padding:0 4px;border:1px solid #d8c48180;border-radius:7px;background:#004a1280;color:#f4df8d;font:700 14px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;touch-action:manipulation}
.shell .game-toolbar .hand-sort-toggle:disabled{opacity:.55;cursor:default}
.shell .game-toolbar .hand-sort-toggle:focus-visible{outline:2px solid #f4df8d;outline-offset:1px}

/* v0.10.7 — card-local touch flash within the existing stacking context. */
.shell .hand-item,.shell .table-item,.shell .build-item{-webkit-tap-highlight-color:transparent;isolation:isolate}
.shell .table-item,.shell .build-item{position:relative}
.shell .hand-item::after,.shell .table-item::after,.shell .build-item::after{content:"";position:absolute;inset:0;z-index:8;border-radius:3px;pointer-events:none;background:rgba(55,145,255,.28);opacity:0;transition:opacity 160ms ease-out}
.shell .hand-item:active:not(:disabled)::after,.shell .table-item:active:not(:disabled)::after,.shell .build-item:active:not(:disabled)::after{opacity:1;transition:none}
@media(prefers-reduced-motion:reduce){.shell .hand-item::after,.shell .table-item::after,.shell .build-item::after{transition:none}}

/* Two-player opponents use the same red team accent as the seating preview. */
.shell:not(.multiplayer-game) .game-toolbar .opponent-tag{border:1px solid #ffffff35;border-top:3px solid var(--seat-color,#ac4847);background:#102e268c;color:#fff;border-radius:10px}

/* Build layers may themselves have high z-indices. Keep the tap flash above
   every constituent within its isolated build button, never above neighbors. */
.shell .build-item::after{z-index:100}
.dialog-actions.exit-confirm-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.exit-confirm-actions .restart-action{grid-column:1/-1;min-width:0}
.exit-confirm-actions .action-btn{min-width:0}

/* v0.10.14 — bounded build lane, single-card summaries and selected previews.
   The card dimensions and the normal stack artwork are deliberately unchanged. */
.shell .table-area{--build-card-width:clamp(48px,14.8vw,69px);--build-lane:clamp(74px,20.5vw,98px)}
.shell .table-stage .table-builds:not(:empty){
  height:84%;max-height:84%;box-sizing:border-box;padding:6px 2px;
  justify-content:safe center;align-items:flex-end;overflow:hidden;
}
.shell .table-builds .build-pile,.shell .build-inspections .build-pile{--stack-card-width:var(--build-card-width)}
.shell .table-stage .table-builds.builds-collapsed:not(:empty){overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.shell .build-item .build-summary{display:none}
.shell .build-item.is-collapsed .build-pile{display:none;pointer-events:none}
.shell .build-item.is-collapsed .build-summary{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:var(--build-card-width);aspect-ratio:.715;box-sizing:border-box;
  background:#12110e;color:#fff;border:1px solid #c8c8c8;border-radius:3px;
  padding:3px 1px;white-space:nowrap;font:650 clamp(8px,2.5vw,12px)/1.1 system-ui,sans-serif;
}
.shell .build-summary strong{font-size:clamp(18px,6vw,30px);line-height:1}
.shell .build-summary.card-selected{color:#fff59b;border-color:#d6a526}
.shell .build-inspections{position:absolute;right:calc(var(--build-lane,98px) + 4px);top:5px;bottom:5px;max-width:calc(100% - var(--build-lane,98px) - 10px);width:max-content;
  display:flex;flex-direction:row-reverse;gap:6px;align-items:flex-start;justify-content:safe flex-start;z-index:15;overflow-x:auto;overflow-y:hidden;pointer-events:none;padding:5px 4px 8px;box-sizing:border-box}
.shell .build-inspections:empty{display:none}
.shell .build-inspection{display:block;flex:0 0 auto;max-height:100%;overflow-y:auto;overflow-x:hidden;padding:0;border:0;border-radius:3px;background:#12110e;box-shadow:0 5px 14px 3px #0009;pointer-events:auto;scrollbar-width:thin;-webkit-tap-highlight-color:transparent}
.shell .build-inspection .build-pile{pointer-events:none}
.shell .build-inspection:focus-visible{outline:2px solid #d6a526;outline-offset:2px}
.cpu-playtest-options{display:grid;gap:5px;border:1px solid #d3c293;border-radius:10px;padding:10px;margin:8px 0;color:#183d2a;background:#f7f1e0}
.cpu-playtest-options h3{font-size:13px;margin:0;color:#183d2a}
.cpu-playtest-options p{font-size:11px;color:#605b4f;line-height:1.3;margin:0 0 3px}
.cpu-playtest-options .cpu-test-toggle{min-height:36px;padding:7px 8px}
.cpu-playtest-options .cpu-test-toggle[aria-pressed=true]{border-color:#a36b27;background:#f8e6bf}
.cpu-playtest-options .cpu-test-toggle:disabled{opacity:.55}
@media(max-height:700px){.shell .table-area{--build-card-width:clamp(42px,12.7vw,57px)}}
@media(orientation:landscape) and (max-height:450px){.shell .table-area{--build-card-width:clamp(34px,6.2vw,53px);--build-lane:clamp(53px,10vw,80px)}}

/* v0.10.15 — the primary build column is reserved; the secondary one
   borrows the rightmost portion of the loose-card lane only when needed.
   Both lanes share the same 14%..98% vertical bounds. */
.shell .table-stage{--build-columns:1}
.shell .table-stage .table-cards,
.shell .table-stage:has(.table-builds:not(:empty)) .table-cards,
.shell .table-stage:not(:has(.table-builds:not(:empty))) .table-cards{
  --row-budget:max(0px,calc(84cqh - 16px));
  width:calc(100% - var(--build-lane)*var(--build-columns))!important;
  max-width:calc(100% - var(--build-lane)*var(--build-columns))!important;
}
.shell .table-stage .table-builds:not(:empty),
.shell .table-stage .table-builds.builds-collapsed:not(:empty){
  width:calc(var(--build-lane)*var(--build-columns) - 3px);
  max-width:calc(var(--build-lane)*var(--build-columns) - 3px);
  height:84%;max-height:84%;top:56%!important;
  display:block;padding:0;overflow:hidden!important;
}
.shell .table-stage .table-builds .build-item{
  position:absolute;right:calc(2px + var(--build-lane)*var(--build-column,0));
  width:max-content;max-height:none;transform:none!important;
}
.shell .table-stage .build-item.is-collapsed .build-summary{
  width:calc(var(--build-card-width)*var(--build-scale,1));
  height:auto;aspect-ratio:.715;
  font-size:calc(clamp(8px,2.5vw,12px)*var(--build-scale,1));
  padding:calc(3px*var(--build-scale,1)) calc(1px*var(--build-scale,1));
  gap:calc(2px*var(--build-scale,1));overflow:hidden;
}
.shell .table-stage .build-summary strong{
  font-size:calc(clamp(18px,6vw,30px)*var(--build-scale,1));

.shell .build-inspections{top:14%;bottom:2%;z-index:15}

  height:94%;max-height:94%;top:52%!important;
}

.shell .table-stage .build-item.is-collapsed .build-summary{

.shell .table-stage .build-summary .build-value-owner,

/* Each expanded preview is anchored to its own summary, not a separate
   fixed rail column. The rail itself stays measurable even while empty. */

.shell .build-inspection.is-closing{pointer-events:none}

.shell .build-inspection{

.shell .build-item.is-inspecting .build-summary{opacity:0}

.shell .build-inspection .build-value-number{font-size:calc(clamp(19px,6vw,29px)*var(--ribbon-card-scale,1))}
@media(max-height:700px){.shell .build-inspections,.shell .build-inspections:empty{--build-card-width:clamp(42px,12.7vw,57px)}}
@media(orientation:landscape) and (max-height:450px){
  .shell .build-inspections,.shell .build-inspections:empty{--build-card-width:clamp(34px,6.2vw,53px)}
  .shell .build-inspection .build-value-owner{font-size:calc(7px*var(--ribbon-card-scale,1))}
  .shell .build-inspection .build-value-number{font-size:calc(clamp(15px,3vw,20px)*var(--ribbon-card-scale,1))}
}

    // cannot overflow its measured height because of fractional card sizes.
    const collapsed=piles.map(p=>p.height>H);
    const order=piles.map((p,i)=>i).sort((a,b)=>piles[b].cards-piles[a].cards||piles[b].height-piles[a].height||a-b);
    const pack=()=>{
      const heights=piles.map((p,i)=>collapsed[i]?S:p.height);
      const total=heights.reduce((a,b)=>a+b,0)+gap*(n-1);
      if(total<=H+1e-7)return {columns:1,assignment:heights.map(()=>0),heights};

      // number of stacks in the primary (rightmost) column. Stable ties
      // retain the earlier build IDs' order within each column.
      const dp=Array(cap+1).fill(null);
      dp[0]={count:0,mask:0n};
      for(let i=0;i<n;i++){
        const w=weights[i];
        for(let j=cap;j>=w;j--){
          const prev=dp[j-w];
          if(!prev)continue;
          const count=prev.count+1;
          if(!dp[j]||count>dp[j].count)dp[j]={count,mask:prev.mask|(1n<<BigInt(i))};
        }
      }
      let best=null;
      for(let j=Math.max(0,sum-cap);j<=cap;j++){

  function issueArea(message){

    if(/Italian face|custom card values|numerical card values/i.test(message))return 'values';

    const fallbackKeys = ['cards','spades','big','little','aces','sweeps','total'];
    const categories=game.result.categories||fallbackKeys.map((key,i)=>[key,fallbackHeads[i]]);
    const keys=categories.map(row=>row[0]),heads=categories.map(row=>row[1]);
    const lead = p[0].total===p[1].total ? -1 : (p[0].total>p[1].total?0:1);

          else if(after)status.querySelector('.rules-status-line')?.after(after);
        }
        const start=status.querySelector('[data-action="apply-settings"]'),newStart=next.querySelector('[data-action="apply-settings"]');
        if(start&&newStart)start.disabled=newStart.disabled;
      }
    }
    const lab=app.querySelector('#rules-area-lab');if(lab)lab.innerHTML=renderLab();
    const labSummary=app.querySelector('[data-action="rules-section"][data-value="lab"] small');if(labSummary)labSummary.textContent='Test your custom rules';
    return true;
  }
  function finishHandSizeText(target){
    if(!draft||draft.dealMode==='full'||handMaximum()<1)return;
    const value=normalizedHandSize(target.value,draft.handSize,handMaximum());
    applyTypedHandSize(value);syncHandSizeControls(value);target.value=String(value);
  }
  function syncBuildBounds(exceptInput){
    for(const key of ['buildMin','buildMax']){
      const choices=buildBoundChoices(key),input=app.querySelector('#range-'+key);
      const select=app.querySelector('[data-setting="buildBoundChoice"][data-bound="'+key+'"]');
      if(input){input.min=String(choices[0]??1);input.max=String(choices[choices.length-1]??30);if(input!==exceptInput)input.value=String(draft[key]??'');}
      if(select){select.innerHTML=choices.map(v=>'<option value="'+v+'" '+(v===draft[key]?'selected':'')+'>'+v+'</option>').join('');}
    }
  }
  function applyBuildBound(key,value,exceptInput){
    if(!draft||draft.presetBlocker||E.ruleActivity(draft).disabled.buildRange||draft.buildRange!=='custom'||!['buildMin','buildMax'].includes(key)||!buildBoundChoices(key).includes(value))return false;
    if(draft[key]!==value){draft[key]=value;refreshNumericRuleEdit();}
    syncBuildBounds(exceptInput);return true;
  }
  function finishBuildBound(target){
    const key=target.dataset.bound;
    if(!['buildMin','buildMax'].includes(key))return;
    const choices=buildBoundChoices(key),raw=target.value.trim();
    const value=raw?nearestBuildValue(choices,raw):draft[key];
    if(value!=null&&applyBuildBound(key,value))target.value=String(value);
  }
  app.addEventListener('change', ev => {
    const target = ev.target;
    if (!(target instanceof HTMLElement) || !target.dataset.setting || target.disabled || modal !== 'settings') return;
    const prop = target.dataset.setting;
    if(prop==='preset')return selectVariation(target.value);
    if(prop==='variantName'){variantNameText=target.value;return;}
    if(prop==='handSizeText')return finishHandSizeText(target);
    if(prop==='buildBoundText')return finishBuildBound(target);
    if(prop==='buildBoundChoice')return applyBuildBound(target.dataset.bound,Number(target.value));
    if(prop==='deckCard')return updateOneDeckCard(target.dataset.cardId,target.checked);
    if(prop==='primaryValue'||prop==='secondaryValue')return updateCardValue(prop,target.value);
    updateDraftSetting(prop,target.type === 'checkbox' ? target.checked :
      ['winningScore','sweepPoints','deckSize','handSize','initialTableSize','aceValue','aceMode','matchDeals','jokerCount','jokerValue','playerCount'].includes(prop)&&target.value!=='4team' ? Number(target.value) : target.value);
  });
  app.addEventListener('input',ev=>{
    const target=ev.target;
    if(modal!=='settings'||target?.disabled)return;
    if(target?.dataset?.setting==='variantName'){variantNameText=target.value;return;}
    if(target?.dataset?.setting==='playerCount'){
      // Preview every slider step without replacing the active range input.
      // The change event commits the configuration and revalidates dealing.
      const n=Number(target.value);
      if(![2,3,4,5,6].includes(n)||draft.presetBlocker)return;
      const allowed=E.teamModesFor(n),mode=allowed.includes(draft.teamMode)?draft.teamMode:'freeForAll';
      const preview={...draft,playerCount:n,teamMode:mode};
      const output=app.querySelector('#player-count-output');if(output)output.textContent=String(n);
      for(const tick of app.querySelectorAll('[data-player-tick]'))tick.classList.toggle('active',Number(tick.dataset.playerTick)===n);
      const control=app.querySelector('#rule-teamMode');
      if(control)control.outerHTML=teamCycleControl(preview);
      if(detailSetting==='teamMode'){
        const help=app.querySelector('.team-mode-setting .rule-option-help');
        if(help)help.outerHTML=ruleExplanation('teamMode',playerTeamOptions(n),preview);
      }
      const diagram=app.querySelector('#player-seating-preview');if(diagram)diagram.innerHTML=seatingDiagram(preview);
      const summary=app.querySelector('#rules-area-players .rules-page-heading small');if(summary)summary.textContent=playerSetupSummary(preview);
      const eyebrow=app.querySelector('.rules-header .rules-eyebrow');if(eyebrow)eyebrow.textContent=playerHeader(preview);
      return;
    }
    if(target?.dataset?.setting==='handSize'){
      syncHandSizeControls(Number(target.value));return;
    }
    if(target?.dataset?.setting==='buildBoundText'){
      if(target.value!=='')applyBuildBound(target.dataset.bound,Number(target.value),target);return;
    }
    if(target?.dataset?.setting==='handSizeText'){
      const value=Number(target.value);
      if(target.value!==''&&Number.isInteger(value)&&value>=1&&value<=handMaximum()){
        applyTypedHandSize(value);syncHandSizeControls(value,true);
      }
    }
  });
  app.addEventListener('keydown',ev=>{
    const target=ev.target;
    if(modal==='settings'&&ev.key==='Enter'){
      if(target?.dataset?.setting==='variantName'){ev.preventDefault();variantNameText=target.value;completeVariantEditor();}
      else if(target?.dataset?.setting==='handSizeText'){ev.preventDefault();finishHandSizeText(target);target.blur();}
      else if(target?.dataset?.setting==='buildBoundText'){ev.preventDefault();finishBuildBound(target);target.blur();}
    }
  });
  app.addEventListener('click', event => {
    const node = event.target.closest('[data-action]');
    if (!node) return;
    const action = node.dataset.action;
    if (action === 'home') {
      if (screen === 'game') { showExitConfirm(); return; }
      exitGameToMenu(); return;
    }
    if (action === 'cancel-exit') { cancelExit(); return; }
    if (action === 'confirm-exit') { exitGameToMenu(); return; }
    if (action === 'resume-game') { screen='game'; modal=''; sound('tap'); if(game.turn!==0 && game.phase==='playing') botTurn(); else {if(game.phase!=='playing')modal='round';render();} return; }
    if (action === 'setup-new-game') { sound('tap'); return openSettings('newgame'); }
    if(modal==='settings'&&action==='save-variant-as')return beginVariantEditor('new');
    if(modal==='settings'&&action==='update-saved-variant')return beginVariantEditor('update');
    if(modal==='settings'&&action==='cancel-variant-save'){clearVariantEditor();render('overlay');return;}
    if(modal==='settings'&&action==='confirm-variant-save'){
      const field=app.querySelector('#variant-name');if(field)variantNameText=field.value;
      return completeVariantEditor();
    }
    if(modal==='settings'&&action==='delete-saved-variant'){
      const entry=savedVariant(savedVariantSource);
      if(!entry||!confirm('Delete saved variant "'+entry.name+'"? Your current game and rules will not be deleted.'))return;
      const result=removeNamedVariant(entry.id);
      if(!result.ok){variantMessage=result.reason;variantMessageError=true;}
      render('overlay');return;
    }
    if(action==='cycle-team-mode'&&modal==='settings'){
      if(node.disabled)return;
      cycleTeamMode();
      if(event.detail===0)app.querySelector('#rule-teamMode')?.focus({preventScroll:true});
      return;
    }
    if (action === 'info-setting' && modal === 'settings') { detailSetting=detailSetting===node.dataset.key?'':node.dataset.key; render('overlay'); return; }
    if(action==='difficulty-info'&&modal==='settings'){difficultyInfoOpen=!difficultyInfoOpen;render('overlay');return;}
    if(modal==='settings'&&(action==='deck-all'||action==='deck-none'))return updateDeckCards(action==='deck-all'?E.allCards().map(c=>c.id):[]);
    if(modal==='settings'&&action==='toggle-value-picker'){if(draft.customizeCardValues&&E.makeDeck(draft).length){valuePickerOpen=!valuePickerOpen;render('overlay');}return;}
    if(modal==='settings'&&action==='value-card'){if(draft.customizeCardValues&&E.makeDeck(draft).some(c=>E.cardKey(c)===node.dataset.value)){valueCardKey=node.dataset.value;valuePickerOpen=false;render('overlay');}return;}
    if(action==='use-partial-preset'&&modal==='settings'){
      const p=E.PRESET_CATALOG.find(x=>x.id===draftPreset);
      if(!p?.partial||!draft.presetBlocker)return;
      draft=E.normalizeRules({...draft,presetBlocker:'',name:'Custom Fishing'});
      savedVariantSource=null;clearVariantEditor();markCustomDraft();labResult=null;rulesIssuesOpen=false;render('overlay');return;
    }
    if (action === 'rules-section' && modal === 'settings'){
      rulesSection=rulesSection==='lab'?'':'lab';render('overlay');return;
    }
    if(action==='rules-issues'&&modal==='settings'){rulesIssuesOpen=!rulesIssuesOpen;render('overlay');return;}
    if(action==='rules-jump'&&modal==='settings'){
      rulesSection='';rulesIssuesOpen=false;detailSetting='';
      render('overlay');const area=app.querySelector('.variations-content');
      const header=area?.querySelector('#rules-area-'+node.dataset.value);
      if(area&&header)area.scrollTop+=header.getBoundingClientRect().top-area.getBoundingClientRect().top;
      return;
    }
    if(action==='reset-rules'&&modal==='settings'){
      if(draftPreset==='custom')customDraft={...draft};
      savedVariantSource=null;clearVariantEditor();
      draft=E.rulesFor('classic',{difficulty:draft.difficulty});draftPreset='classic';rulesIssuesOpen=false;labResult=null;detailSetting='';valuePickerOpen=false;valueCardKey='S1';deckChecklistScroll=0;render('overlay');return;
    }
    if (action === 'run-rules-lab' && modal === 'settings'){
      if(!E.validateRules(effectiveDraftRules()).playable)return;
      const snapshot=JSON.stringify(draft);node.disabled=true;node.textContent='Testing…';
      setTimeout(()=>{if(modal!=='settings'||JSON.stringify(draft)!==snapshot)return;labResult=E.simulateRules(effectiveDraftRules(),10,1);render('overlay');},0);return;
    }
    if (action === 'copy-lab-report' && modal === 'settings' && labResult){
      const report=JSON.stringify(labResult,null,2);
      if(navigator.clipboard?.writeText)navigator.clipboard.writeText(report).catch(()=>window.prompt('Copy report',report));
      else window.prompt('Copy report',report);return;
    }
    if (action === 'setup-difficulty' && modal === 'settings') { draft.difficulty=node.dataset.value; render('overlay'); return; }
    if (action === 'menu') { modal = 'menu'; sound('tap'); render('overlay'); return; }
    if (action === 'settings' && screen === 'home') return openSettings(screen);
    if (action === 'history') { modal = action; render('overlay'); return; }
    if (action === 'toggle-sound') { prefs.sound = !prefs.sound; savePrefs(); if (prefs.sound) sound('tap'); render('overlay'); return; }
    if (action === 'toggle-animations' && screen === 'home') { prefs.animations = !prefs.animations; savePrefs(); render('overlay'); return; }
    if (action === 'toggle-hand-sort') {
      // Do not move a live flight/deal destination. The selected card and
      // table selection are identified by ID and survive a presentation sort.
      if(modal||!isHumanTurn()||node.disabled)return;
      prefs.handSort=nextHandSortMode();
      savePrefs();
      render();
      if(event.detail===0)app.querySelector('[data-action="toggle-hand-sort"]')?.focus({preventScroll:true});
      return;
    }
    if(action==='toggle-cpu-playtest'&&(modal==='menu'||modal==='settings')){
      const key=node.dataset.key;
      if(busy||dealing||turnInMotion||!['noCapture','noBuild','noMultiBuild'].includes(key))return;
      prefs.cpuPlaytest={...prefs.cpuPlaytest,[key]:!prefs.cpuPlaytest?.[key]};
      cancelComputerSearch();savePrefs();render('overlay');return;
    }
    if (action === 'toggle-undo') { prefs.undo = !prefs.undo; savePrefs(); render('overlay'); return; }
    if (action === 'close') { modal = ''; render('overlay'); applyPendingUpdate(); if(screen==='game'&&!busy&&game.phase==='playing'&&game.turn!==0){toast='';botTurn();} return; }
    if (action === 'new-match') return startNewMatch(game.rules, true);
    if (action === 'next-hand') return nextHand();
    if (action === 'undo') return undo();
    if (action === 'apply-settings' && modal === 'settings') {
      const saved=savedVariant(draftPreset);
      const nextRules={...effectiveDraftRules(),name:saved?saved.name:draftPreset==='custom'?'Custom Fishing':E.PRESETS[draftPreset].name};
      if(saved)nextRules.savedVariantId=saved.id;else delete nextRules.savedVariantId;
      if(!E.validateRules(nextRules).playable)return;
      if (screen === 'game' && game.phase === 'playing' && !confirm('Start a new match with these rules?')) return;
      if (draftPreset==='custom') {customRules = {...draft,name:nextRules.name};saveCustomRules();}
      return startNewMatch(nextRules, false);
    }
    if (action === 'hand') {
      if (!isHumanTurn()) return;
      const id = node.dataset.id;
      pickedCard = pickedCard === id ? null : id;
      hintIterator = null; toast = '';
      sound('tap'); return render('selection');
    }
    if (action === 'table' || action === 'inspect-build') {
      if (!isHumanTurn()) return;
      const id = node.dataset.id;
      if (pickedTable.has(id)) pickedTable.delete(id); else pickedTable.add(id);
      hintIterator = null; toast = ''; sound('tap'); return render('selection');
    }
    if (action === 'clear') { resetSelection(); toast = ''; return render('selection'); }
    if (action === 'trail' || action === 'capture') return play({ kind: action, cardId: pickedCard, targetIds: action === 'trail' ? [] : currentSelection() });
    if (action === 'build') return play(buildOptions[Number(node.dataset.index)]);
    if (action === 'hint') return suggestMove();
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && modal) {
      if (modal === 'exit-confirm') { cancelExit(); return; }
      modal = ''; render('overlay'); applyPendingUpdate(); if(screen==='game'&&!busy&&game.phase==='playing'&&game.turn!==0){toast='';botTurn();} return;
    }
    else if (ev.key.toLowerCase() === 'u' && !modal && prefs.undo && checkpoint) undo();
  });
  window.addEventListener('resize',()=>{if(screen==='game'){layoutBuilds(app.querySelector('.table-builds')?.scrollTop||0);layoutHumanHand();}});
  render(); // The main menu is the entry point; the computer does not move until Resume/Start.
  if (/^https?:/.test(location.protocol)) {
    // A version file is checked at launch, even if the browser has cached the app.
    // The player never has to approve an update, and an active game is never reloaded.
    checkForAppUpdate();
    window.addEventListener('online', checkForAppUpdate);
    window.addEventListener('pageshow', event => {
      if (event.persisted) checkForAppUpdate();
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', checkForAppUpdate);
      navigator.serviceWorker.register('./service-worker.js')
        .then(registration => {
          registration.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
              registration.update().catch(() => {});
              checkForAppUpdate();
            }
          });
        }).catch(() => {});
    }
  }
})();

</script>
</body></html>
